<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="fsTitle fsDesc">
  <title id="fsTitle">FIFO shelf order, back to front</title>
  <desc id="fsDesc">Side view of a storage shelf with newly added dated containers at the back and older dated containers at the front, with an arrow showing the older container is reached first.</desc>
  <defs>
    <marker id="fsArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c8553a"/>
    </marker>
  </defs>

  <rect width="960" height="420" fill="#0a0c10"/>
  <text x="40" y="44" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="12" letter-spacing="3" fill="rgba(255,255,255,0.35)">FIFO SHELF ORDER &#183; NEW TO THE BACK, OLD TO THE FRONT</text>

  <!-- shelf -->
  <rect x="60" y="308" width="840" height="8" rx="4" fill="rgba(255,255,255,0.16)"/>
  <rect x="60" y="316" width="840" height="4" rx="2" fill="rgba(255,255,255,0.06)"/>

  <!-- back container -->
  <rect x="640" y="196" width="180" height="112" rx="10" fill="#1a1d23" stroke="rgba(34,197,94,0.35)"/>
  <text x="730" y="228" text-anchor="middle" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#ffffff">Newest stock</text>
  <text x="730" y="250" text-anchor="middle" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="11.5" fill="rgba(255,255,255,0.42)">loaded this trip</text>
  <rect x="672" y="264" width="116" height="26" rx="6" fill="rgba(34,197,94,0.10)" stroke="rgba(34,197,94,0.35)"/>
  <text x="730" y="281" text-anchor="middle" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="12" fill="#22c55e">MM / YYYY</text>

  <!-- middle container -->
  <rect x="412" y="196" width="180" height="112" rx="10" fill="#1a1d23" stroke="rgba(255,255,255,0.08)"/>
  <text x="502" y="228" text-anchor="middle" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#ffffff">Stock in between</text>
  <text x="502" y="250" text-anchor="middle" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="11.5" fill="rgba(255,255,255,0.42)">moves forward over time</text>
  <rect x="444" y="264" width="116" height="26" rx="6" fill="rgba(245,158,11,0.10)" stroke="rgba(245,158,11,0.35)"/>
  <text x="502" y="281" text-anchor="middle" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="12" fill="#f59e0b">MM / YYYY</text>

  <!-- front container -->
  <rect x="150" y="196" width="180" height="112" rx="10" fill="#1a1d23" stroke="rgba(200,85,58,0.55)"/>
  <text x="240" y="228" text-anchor="middle" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#ffffff">Oldest stock</text>
  <text x="240" y="250" text-anchor="middle" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="11.5" fill="rgba(255,255,255,0.42)">closest to its date</text>
  <rect x="182" y="264" width="116" height="26" rx="6" fill="rgba(200,85,58,0.12)" stroke="rgba(200,85,58,0.45)"/>
  <text x="240" y="281" text-anchor="middle" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="12" fill="#c8553a">MM / YYYY</text>

  <!-- reach path -->
  <path d="M 870 120 C 700 60 340 60 262 176" fill="none" stroke="#c8553a" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#fsArrow)"/>
  <text x="600" y="86" text-anchor="middle" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.65)">reach for the front container first</text>

  <text x="240" y="352" text-anchor="middle" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="11.5" letter-spacing="2" fill="#c8553a">FRONT &#183; USE FIRST</text>
  <text x="730" y="352" text-anchor="middle" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="11.5" letter-spacing="2" fill="rgba(255,255,255,0.35)">BACK &#183; LOAD NEWEST</text>

  <text x="40" y="396" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="11.5" fill="rgba(255,255,255,0.35)">FEMA 477 / A5055: &#8220;Place new items at the back of the storage area and older ones in front.&#8221;</text>
</svg>
