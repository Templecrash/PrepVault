<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 810" width="900" height="810" role="img" aria-labelledby="pcTitle pcDesc">
  <title id="pcTitle">Printable household rotation chart</title>
  <desc id="pcDesc">Printable household rotation chart listing food, self-stored water, commercially bottled water, and medication, with each category's rule, check cadence, rotation direction, and government source.</desc>

  <rect width="900" height="810" fill="#0a0c10"/>
  <rect x="20" y="20" width="860" height="770" rx="14" fill="#0d1117" stroke="rgba(255,255,255,0.10)"/>

  <text x="48" y="66" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="19" font-weight="800" fill="#ffffff">PREPVAULT &#8212; HOUSEHOLD ROTATION CHART</text>
  <text x="48" y="88" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="11" fill="rgba(255,255,255,0.35)">ONE PAGE &#183; KEEP IT WHERE THE STOCK IS</text>

  <!-- table header -->
  <rect x="40" y="104" width="820" height="28" rx="6" fill="rgba(255,255,255,0.04)"/>
  <text x="52" y="123" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="10.5" letter-spacing="1.5" fill="rgba(255,255,255,0.45)">CATEGORY</text>
  <text x="184" y="123" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="10.5" letter-spacing="1.5" fill="rgba(255,255,255,0.45)">RULE</text>
  <text x="564" y="123" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="10.5" letter-spacing="1.5" fill="rgba(255,255,255,0.45)">CHECK</text>
  <text x="694" y="123" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="10.5" letter-spacing="1.5" fill="rgba(255,255,255,0.45)">DIRECTION</text>

  <!-- row rules -->
  <line x1="40" y1="222" x2="860" y2="222" stroke="rgba(255,255,255,0.06)"/>
  <line x1="40" y1="302" x2="860" y2="302" stroke="rgba(255,255,255,0.06)"/>
  <line x1="40" y1="382" x2="860" y2="382" stroke="rgba(255,255,255,0.06)"/>
  <line x1="40" y1="462" x2="860" y2="462" stroke="rgba(255,255,255,0.12)"/>

  <!-- row 1 -->
  <text x="52" y="152" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="14" font-weight="800" fill="#ffffff">Food</text>
  <text x="184" y="150" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="11.5" fill="rgba(255,255,255,0.62)">FIFO: new to the back, old to the front,</text>
  <text x="184" y="166" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="11.5" fill="rgba(255,255,255,0.62)">every container dated in ink</text>
  <text x="564" y="150" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="11.5" fill="#22c55e">6 months</text>
  <text x="694" y="150" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#22c55e">Oldest first</text>
  <text x="52" y="196" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="9.5" fill="rgba(255,255,255,0.32)">FEMA 477 / A5055</text>

  <!-- row 2 -->
  <text x="52" y="232" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="14" font-weight="800" fill="#ffffff">Water</text>
  <text x="52" y="248" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="10" fill="rgba(255,255,255,0.4)">SELF-STORED</text>
  <text x="184" y="238" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="11.5" fill="rgba(255,255,255,0.62)">Replace water you store yourself &#8212;</text>
  <text x="184" y="254" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="11.5" fill="rgba(255,255,255,0.62)">not commercially bottled</text>
  <text x="564" y="238" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="11.5" fill="#f59e0b">6 months</text>
  <text x="694" y="238" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#22c55e">Oldest first</text>
  <text x="52" y="280" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="9.5" fill="rgba(255,255,255,0.32)">READY.GOV, WATER</text>

  <!-- row 3 -->
  <text x="52" y="312" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="14" font-weight="800" fill="#ffffff">Water</text>
  <text x="52" y="328" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="10" fill="rgba(255,255,255,0.4)">BOTTLED</text>
  <text x="184" y="318" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="11.5" fill="rgba(255,255,255,0.62)">Keep sealed in the original container,</text>
  <text x="184" y="334" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="11.5" fill="rgba(255,255,255,0.62)">in a cool, dark place</text>
  <text x="564" y="318" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="10.5" fill="rgba(255,255,255,0.45)">no interval stated</text>
  <text x="694" y="318" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#22c55e">Keep sealed</text>
  <text x="52" y="360" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="9.5" fill="rgba(255,255,255,0.32)">READY.GOV, WATER</text>

  <!-- row 4 -->
  <text x="52" y="392" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="14" font-weight="800" fill="#ffffff">Medication</text>
  <text x="184" y="398" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="11.5" fill="rgba(255,255,255,0.62)">Replace at the printed expiry date &#8212;</text>
  <text x="184" y="414" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="11.5" fill="rgba(255,255,255,0.62)">no guarantee of safety or effectiveness after it</text>
  <text x="564" y="398" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="11.5" fill="#ef4444">at expiry</text>
  <text x="694" y="398" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#ef4444">REPLACE, not FIFO</text>
  <text x="52" y="440" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="9.5" fill="rgba(255,255,255,0.32)">FDA</text>

  <!-- cadence -->
  <rect x="40" y="482" width="820" height="140" rx="10" fill="rgba(200,85,58,0.05)" stroke="rgba(200,85,58,0.20)"/>
  <text x="60" y="510" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="11" letter-spacing="2" fill="#c8553a">CADENCE</text>
  <text x="60" y="538" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="12.5" fill="rgba(255,255,255,0.72)"><tspan font-weight="700" fill="#ffffff">Every 6 months</tspan> &#8212; rotate food, replace self-stored water, date-check medication, replace expired</text>
  <text x="60" y="566" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="12.5" fill="rgba(255,255,255,0.72)"><tspan font-weight="700" fill="#ffffff">Annually</tspan> &#8212; review indefinite-storage items, confirm containers and conditions, re-date what you keep</text>
  <text x="60" y="594" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="12.5" fill="rgba(255,255,255,0.72)"><tspan font-weight="700" fill="#ffffff">On every use</tspan> &#8212; pull from the front, replace at the back with a fresh date</text>

  <!-- shelf order rule -->
  <rect x="40" y="642" width="820" height="66" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="60" y="668" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="11" letter-spacing="2" fill="rgba(255,255,255,0.45)">SHELF ORDER RULE</text>
  <text x="60" y="692" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="12.5" fill="rgba(255,255,255,0.72)">If you can reach a newer item without moving an older one, the shelf order has drifted. Fix it before you walk away.</text>

  <text x="40" y="742" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="10.5" fill="rgba(255,255,255,0.32)">SOURCES: FEMA 477 / A5055 (AUGUST 2004) &#183; READY.GOV, WATER &#183; FDA, DON'T BE TEMPTED TO USE EXPIRED MEDICINES</text>
  <text x="40" y="762" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="10.5" fill="rgba(255,255,255,0.32)">THE DIRECTION COLUMN IS THE PART TO READ TWICE.</text>
</svg>
