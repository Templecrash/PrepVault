<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="rcTitle rcDesc">
  <title id="rcTitle">Cross-category rotation cadence</title>
  <desc id="rcDesc">Three rotation lanes for stored food, water, and medication. Food and self-stored water rotate oldest-first; medication is replaced at its expiry date, the opposite direction.</desc>
  <defs>
    <marker id="rcArrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="rcArrowL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#0a0c10"/>
  <text x="40" y="44" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="12" letter-spacing="3" fill="rgba(255,255,255,0.35)">ONE CADENCE &#183; THREE CATEGORIES</text>

  <!-- Food lane -->
  <rect x="40" y="70" width="880" height="104" rx="14" fill="#1a1d23" stroke="rgba(255,255,255,0.06)"/>
  <text x="64" y="108" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="20" font-weight="800" fill="#ffffff">Food</text>
  <text x="64" y="129" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="12.5" fill="rgba(255,255,255,0.42)">Dated, shelved stock &#8212; first-in, first-out</text>
  <rect x="64" y="140" width="212" height="22" rx="6" fill="rgba(200,85,58,0.10)" stroke="rgba(200,85,58,0.35)"/>
  <text x="76" y="155" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="11.5" fill="#c8553a">6 MONTHS / 1 YEAR / INDEFINITE</text>
  <text x="480" y="104" text-anchor="middle" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.65)">take from the old end, refill at the back</text>
  <line x1="330" y1="124" x2="628" y2="124" stroke="#22c55e" stroke-width="3" marker-end="url(#rcArrowR)"/>
  <rect x="700" y="88" width="196" height="68" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
  <text x="798" y="112" text-anchor="middle" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="10.5" letter-spacing="2" fill="rgba(255,255,255,0.35)">SHELF LIFE</text>
  <text x="798" y="136" text-anchor="middle" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#22c55e">Bucketed, not one number</text>

  <!-- Water lane -->
  <rect x="40" y="190" width="880" height="104" rx="14" fill="#1a1d23" stroke="rgba(255,255,255,0.06)"/>
  <text x="64" y="228" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="20" font-weight="800" fill="#ffffff">Water you store yourself</text>
  <text x="64" y="249" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="12.5" fill="rgba(255,255,255,0.42)">Filled containers &#8212; not commercially bottled</text>
  <rect x="64" y="260" width="212" height="22" rx="6" fill="rgba(245,158,11,0.10)" stroke="rgba(245,158,11,0.35)"/>
  <text x="76" y="275" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="11.5" fill="#f59e0b">REPLACE EVERY 6 MONTHS</text>
  <text x="480" y="224" text-anchor="middle" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.65)">same direction as food</text>
  <line x1="330" y1="244" x2="628" y2="244" stroke="#22c55e" stroke-width="3" marker-end="url(#rcArrowR)"/>
  <rect x="700" y="208" width="196" height="68" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
  <text x="798" y="232" text-anchor="middle" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="10.5" letter-spacing="2" fill="rgba(255,255,255,0.35)">REPLACE INTERVAL</text>
  <text x="798" y="256" text-anchor="middle" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f59e0b">Every six months</text>

  <!-- Medication lane -->
  <rect x="40" y="310" width="880" height="104" rx="14" fill="#1a1d23" stroke="rgba(239,68,68,0.22)"/>
  <text x="64" y="348" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="20" font-weight="800" fill="#ffffff">Medication</text>
  <text x="64" y="369" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="12.5" fill="rgba(255,255,255,0.42)">Date-checked, replaced at the printed date</text>
  <rect x="64" y="380" width="212" height="22" rx="6" fill="rgba(239,68,68,0.10)" stroke="rgba(239,68,68,0.35)"/>
  <text x="76" y="395" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="11.5" fill="#ef4444">REPLACE AT EXPIRY</text>
  <text x="480" y="344" text-anchor="middle" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#ef4444">opposite direction &#8212; not oldest-first</text>
  <line x1="628" y1="364" x2="332" y2="364" stroke="#ef4444" stroke-width="3" marker-end="url(#rcArrowL)"/>
  <rect x="700" y="328" width="196" height="68" rx="12" fill="rgba(239,68,68,0.06)" stroke="rgba(239,68,68,0.18)"/>
  <text x="798" y="352" text-anchor="middle" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="10.5" letter-spacing="2" fill="rgba(255,255,255,0.35)">TRIGGER</text>
  <text x="798" y="376" text-anchor="middle" font-family="Outfit,'DM Sans','Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#ef4444">The printed expiry date</text>

  <text x="40" y="452" font-family="'Geist Mono','JetBrains Mono',monospace" font-size="11.5" fill="rgba(255,255,255,0.35)">SOURCES: FEMA 477 / A5055 (food) &#183; Ready.gov, Water (water) &#183; FDA (medication)</text>
</svg>
