<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Call for help and apply direct pressure.</title><desc id="desc">A gloved hand presses a dressing over a forearm wound on a firm surface. Downward arrows indicate steady pressure; a phone reminds the helper to call emergency services.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#294B3B"/></marker></defs><rect width="720" height="400" rx="16" fill="#F8FAF5"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="39" font-size="24" fill="#294B3B" text-anchor="start" font-weight="600">Call for help and apply direct pressure.</text><text x="24" y="65" font-size="12" fill="#5B6F5D" text-anchor="start" font-weight="600">PREPVAULT · VISUAL FIELD NOTES</text><rect x="24" y="88" width="672" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><rect x="47" y="137" width="82" height="126" rx="10" fill="white" stroke="#294B3B" stroke-width="3"/><path d="M71 148 h34" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="88" cy="248" r="4" fill="none" stroke="#294B3B" stroke-width="2"/><text x="88" y="180" font-size="13" fill="#294B3B" text-anchor="middle" font-weight="400">CALL</text><text x="88" y="199" font-size="13" fill="#294B3B" text-anchor="middle" font-weight="400">EMERGENCY</text><text x="88" y="218" font-size="13" fill="#294B3B" text-anchor="middle" font-weight="400">SERVICES</text><path d="M210 256 C275 239 345 248 412 245 L590 242 Q622 246 631 260 L636 280 Q615 295 593 288 L414 287 C337 294 273 280 210 293 Z" fill="#F4EEE0" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="363" y="238" width="101" height="46" rx="4" fill="white" stroke="#294B3B" stroke-width="3"/><path d="M492 168 L515 191 L464 233 Q455 242 438 242 H375 Q360 242 360 232 Q360 225 375 225 H403 L391 219 Q382 214 389 207 Q395 201 405 205 L427 216 L454 191 Z" fill="#DDE7D8" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M480 179 l23 24" fill="none" stroke="#5B6F5D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M376 234 h32" fill="none" stroke="#5B6F5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M390 164 L390 198" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M426 164 L426 202" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="528" y="122" font-size="17" fill="#294B3B" text-anchor="middle" font-weight="600">Steady, firm pressure</text><text x="527" y="147" font-size="17" fill="#294B3B" text-anchor="middle" font-weight="400">through a dressing</text><path d="M558 179 L466 258" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="420" y="320" font-size="15" fill="#294B3B" text-anchor="middle" font-weight="400">Support the arm on a firm, flat surface</text><path d="M24 356 H696" fill="none" stroke="#DDE7D8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="381" font-size="13" fill="#5B6F5D" text-anchor="start" font-weight="400">Do not pull out embedded objects. Press around them and follow the dispatcher.</text></g></svg>