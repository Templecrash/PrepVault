<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Identify the appliance before servicing it.</title><desc id="desc">A generic heating appliance with a model/fuel/serial label, a vent and an arrow to the matching manufacturer guide.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#294B3B"/></marker></defs><rect width="720" height="400" rx="16" fill="#F8FAF5"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="39" font-size="24" fill="#294B3B" text-anchor="start" font-weight="600">Identify the appliance before servicing it.</text><text x="24" y="65" font-size="12" fill="#5B6F5D" text-anchor="start" font-weight="600">PREPVAULT · VISUAL FIELD NOTES</text><rect x="24" y="88" width="672" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><rect x="71" y="132" width="154" height="177" rx="10" fill="white" stroke="#294B3B" stroke-width="3"/><path d="M112 132 v-32 h65 v32" fill="none" stroke="#5B6F5D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="94" y="174" width="107" height="54" rx="3" fill="#DDE7D8" stroke="#294B3B" stroke-width="2"/><text x="148" y="196" font-size="12" fill="#294B3B" text-anchor="middle" font-weight="400">MODEL / FUEL</text><text x="148" y="215" font-size="12" fill="#294B3B" text-anchor="middle" font-weight="400">SERIAL NUMBER</text><path d="M102 258 h91 M102 273 h91 M102 288 h91" fill="none" stroke="#5B6F5D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M239 204 L315 204" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="336" y="127" width="113" height="143" rx="4" fill="white" stroke="#294B3B" stroke-width="3"/><text x="392" y="156" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="600">MAKER’S GUIDE</text><path d="M356 175 h73 M356 192 h61 M356 209 h73 M356 226 h45" fill="none" stroke="#5B6F5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="486" y="147" font-size="16" fill="#294B3B" text-anchor="start" font-weight="400">Match the exact appliance.</text><text x="486" y="182" font-size="16" fill="#294B3B" text-anchor="start" font-weight="400">Keep vents unobstructed.</text><text x="486" y="217" font-size="16" fill="#294B3B" text-anchor="start" font-weight="400">Arrange qualified service.</text><text x="486" y="280" font-size="14" fill="#294B3B" text-anchor="start" font-weight="400">Pilot, restart and bleeding</text><text x="486" y="303" font-size="14" fill="#294B3B" text-anchor="start" font-weight="400">procedures are model-specific.</text><path d="M24 356 H696" fill="none" stroke="#DDE7D8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="381" font-size="13" fill="#5B6F5D" text-anchor="start" font-weight="400">Gas smell or a CO alarm: leave for fresh air and call emergency services.</text></g></svg>