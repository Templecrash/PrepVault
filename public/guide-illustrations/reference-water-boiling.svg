<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Treat germs, then protect clean water.</title><desc id="desc">Cloudy water is strained, clear water is boiled, then cooled and put in a covered container.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#294B3B"/></marker></defs><rect width="720" height="400" rx="16" fill="#F8FAF5"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="39" font-size="24" fill="#294B3B" text-anchor="start" font-weight="600">Treat germs, then protect clean water.</text><text x="24" y="65" font-size="12" fill="#5B6F5D" text-anchor="start" font-weight="600">PREPVAULT · VISUAL FIELD NOTES</text><rect x="24" y="88" width="208" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><circle cx="48" cy="112" r="13" fill="#294B3B" stroke="#294B3B" stroke-width="2"/><text x="48" y="117" font-size="14" fill="white" text-anchor="middle" font-weight="600">1</text><text x="70" y="117" font-size="16" fill="#294B3B" text-anchor="start" font-weight="600">Clarify if cloudy</text><rect x="256" y="88" width="208" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><circle cx="280" cy="112" r="13" fill="#294B3B" stroke="#294B3B" stroke-width="2"/><text x="280" y="117" font-size="14" fill="white" text-anchor="middle" font-weight="600">2</text><text x="302" y="117" font-size="16" fill="#294B3B" text-anchor="start" font-weight="600">Rolling boil</text><rect x="488" y="88" width="208" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><circle cx="512" cy="112" r="13" fill="#294B3B" stroke="#294B3B" stroke-width="2"/><text x="512" y="117" font-size="14" fill="white" text-anchor="middle" font-weight="600">3</text><text x="534" y="117" font-size="16" fill="#294B3B" text-anchor="start" font-weight="600">Cool; cover</text><g transform="translate(55 150) scale(1)"><path d="M8 10 h115 l-45 56 v28 h-25 V66 Z" fill="#DDE7D8" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M25 15 h82" fill="none" stroke="#5B6F5D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M58 100 v25" fill="none" stroke="#638485" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="25" y="108" width="80" height="18" rx="4" fill="#DDE7D8" stroke="#294B3B" stroke-width="2"/></g><text x="128" y="294" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="400">Clean cloth or filter</text><text x="128" y="314" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="400">removes cloudiness</text><g transform="translate(317 187) scale(1)"><rect x="0" y="0" width="83" height="65" rx="8" fill="white" stroke="#294B3B" stroke-width="3"/><path d="M-10 10 h10 M83 10 h10" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M8 0 v-7 h67 v7" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M20 -20 q-10 -10 0 -20 M42 -20 q-10 -10 0 -20 M64 -20 q-10 -10 0 -20" fill="none" stroke="#5B6F5D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="360" y="294" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="400">1 minute at a rolling boil</text><text x="360" y="314" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="400">3 minutes above 6,500 ft</text><g transform="translate(547 165) scale(1)"><rect x="4" y="20" width="82" height="83" rx="8" fill="#DDE7D8" stroke="#294B3B" stroke-width="2"/><rect x="12" y="8" width="66" height="14" rx="3" fill="white" stroke="#294B3B" stroke-width="2"/><path d="M20 73 h50" fill="none" stroke="#5B6F5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="592" y="294" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="400">Sanitized container</text><text x="592" y="314" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="400">with a tight cover</text><path d="M24 356 H696" fill="none" stroke="#DDE7D8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="381" font-size="13" fill="#5B6F5D" text-anchor="start" font-weight="400">Boiling cannot remove fuel, toxic chemicals or radioactive contamination.</text></g></svg>