<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Separate rain cover, bedding and ground insulation.</title><desc id="desc">Tent cross-section with guy lines and pegs, a sleeping bag, and a separate insulating sleeping pad underneath.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#294B3B"/></marker></defs><rect width="720" height="400" rx="16" fill="#F8FAF5"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="39" font-size="24" fill="#294B3B" text-anchor="start" font-weight="600">Separate rain cover, bedding and ground insulation.</text><text x="24" y="65" font-size="12" fill="#5B6F5D" text-anchor="start" font-weight="600">PREPVAULT · VISUAL FIELD NOTES</text><path d="M66 311 H654" fill="none" stroke="#5B6F5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M131 309 L336 117 L559 309 Z" fill="#DDE7D8" stroke="#294B3B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M336 117 L336 309 M336 117 L441 309" fill="none" stroke="#5B6F5D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M139 279 L72 307 M553 283 L626 307" fill="none" stroke="#5B6F5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M64 303 l11 17 M623 304 l9 15" fill="none" stroke="#A27C43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="207" y="284" width="190" height="12" rx="3" fill="#DDE7D8" stroke="#294B3B" stroke-width="2"/><rect x="224" y="261" width="151" height="21" rx="11" fill="#EEF0E4" stroke="#294B3B" stroke-width="2"/><text x="46" y="111" font-size="16" fill="#294B3B" text-anchor="start" font-weight="400">Weather-appropriate</text><text x="46" y="133" font-size="16" fill="#294B3B" text-anchor="start" font-weight="400">tent or tarp</text><path d="M179 127 L238 204" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="480" y="126" font-size="16" fill="#294B3B" text-anchor="start" font-weight="400">Secure guy lines</text><path d="M540 140 L580 283" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="469" y="244" font-size="16" fill="#294B3B" text-anchor="start" font-weight="400">Sleeping bag / bedding</text><path d="M467 253 L378 270" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="469" y="294" font-size="16" fill="#294B3B" text-anchor="start" font-weight="400">Insulating sleeping pad</text><path d="M466 301 L402 291" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M24 356 H696" fill="none" stroke="#DDE7D8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="381" font-size="13" fill="#5B6F5D" text-anchor="start" font-weight="400">Practise setup first. A tent or tarp is not a tornado shelter.</text></g></svg>