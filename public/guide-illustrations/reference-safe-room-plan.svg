<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">A safe room starts with an engineered design.</title><desc id="desc">Site review, the FEMA P-320 plan document, and a tested door assembly shown as three planning checks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#294B3B"/></marker></defs><rect width="720" height="400" rx="16" fill="#F8FAF5"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="39" font-size="24" fill="#294B3B" text-anchor="start" font-weight="600">A safe room starts with an engineered design.</text><text x="24" y="65" font-size="12" fill="#5B6F5D" text-anchor="start" font-weight="600">PREPVAULT · VISUAL FIELD NOTES</text><rect x="24" y="88" width="208" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><circle cx="48" cy="112" r="13" fill="#294B3B" stroke="#294B3B" stroke-width="2"/><text x="48" y="117" font-size="14" fill="white" text-anchor="middle" font-weight="600">1</text><text x="70" y="117" font-size="16" fill="#294B3B" text-anchor="start" font-weight="600">Check the site</text><rect x="256" y="88" width="208" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><circle cx="280" cy="112" r="13" fill="#294B3B" stroke="#294B3B" stroke-width="2"/><text x="280" y="117" font-size="14" fill="white" text-anchor="middle" font-weight="600">2</text><text x="302" y="117" font-size="16" fill="#294B3B" text-anchor="start" font-weight="600">Use engineered plans</text><rect x="488" y="88" width="208" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><circle cx="512" cy="112" r="13" fill="#294B3B" stroke="#294B3B" stroke-width="2"/><text x="512" y="117" font-size="14" fill="white" text-anchor="middle" font-weight="600">3</text><text x="534" y="117" font-size="16" fill="#294B3B" text-anchor="start" font-weight="600">Verify the assembly</text><g transform="translate(53 156) scale(1)"><path d="M3 52 L75.5 2 L148 52" fill="#DDE7D8" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="18" y="52" width="115" height="69" rx="0" fill="white" stroke="#294B3B" stroke-width="3"/><rect x="38" y="74" width="35" height="33" rx="0" fill="#DDE7D8" stroke="#294B3B" stroke-width="2"/><rect x="80" y="82" width="33" height="39" rx="0" fill="#DDE7D8" stroke="#294B3B" stroke-width="2"/></g><text x="128" y="310" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="400">Hazards, permits, access</text><rect x="304" y="145" width="113" height="143" rx="4" fill="white" stroke="#294B3B" stroke-width="3"/><text x="360" y="174" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="600">FEMA P-320</text><path d="M324 193 h73 M324 210 h61 M324 227 h73 M324 244 h45" fill="none" stroke="#5B6F5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="360" y="310" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="400">Qualified design review</text><rect x="552" y="145" width="82" height="140" rx="1" fill="#DDE7D8" stroke="#294B3B" stroke-width="4"/><rect x="563" y="155" width="60" height="121" rx="0" fill="white" stroke="#294B3B" stroke-width="2"/><circle cx="610" cy="226" r="4" fill="#294B3B" stroke="#294B3B" stroke-width="2"/><path d="M546 167 h10 M546 239 h10" fill="none" stroke="#294B3B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="592" y="308" font-size="13" fill="#294B3B" text-anchor="middle" font-weight="400">Specified door and fixings</text><path d="M24 356 H696" fill="none" stroke="#DDE7D8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="381" font-size="13" fill="#5B6F5D" text-anchor="start" font-weight="400">Do not build from this schematic. Use the approved design and local requirements.</text></g></svg>