<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Shelter and dry insulation while help is coming.</title><desc id="desc">A sheltered location, wet clothing being removed, and a person wrapped in dry layers with their face uncovered.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#294B3B"/></marker></defs><rect width="720" height="400" rx="16" fill="#F8FAF5"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="39" font-size="24" fill="#294B3B" text-anchor="start" font-weight="600">Shelter and dry insulation while help is coming.</text><text x="24" y="65" font-size="12" fill="#5B6F5D" text-anchor="start" font-weight="600">PREPVAULT · VISUAL FIELD NOTES</text><rect x="24" y="88" width="208" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><circle cx="48" cy="112" r="13" fill="#294B3B" stroke="#294B3B" stroke-width="2"/><text x="48" y="117" font-size="14" fill="white" text-anchor="middle" font-weight="600">1</text><text x="70" y="117" font-size="16" fill="#294B3B" text-anchor="start" font-weight="600">Get help; find shelter</text><rect x="256" y="88" width="208" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><circle cx="280" cy="112" r="13" fill="#294B3B" stroke="#294B3B" stroke-width="2"/><text x="280" y="117" font-size="14" fill="white" text-anchor="middle" font-weight="600">2</text><text x="302" y="117" font-size="16" fill="#294B3B" text-anchor="start" font-weight="600">Remove wet layers</text><rect x="488" y="88" width="208" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><circle cx="512" cy="112" r="13" fill="#294B3B" stroke="#294B3B" stroke-width="2"/><text x="512" y="117" font-size="14" fill="white" text-anchor="middle" font-weight="600">3</text><text x="534" y="117" font-size="16" fill="#294B3B" text-anchor="start" font-weight="600">Insulate with dry layers</text><g transform="translate(54 164) scale(1)"><path d="M0 50 L72.5 0 L145 50" fill="#DDE7D8" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="15" y="50" width="115" height="78" rx="0" fill="white" stroke="#294B3B" stroke-width="3"/><rect x="35" y="72" width="35" height="33" rx="0" fill="#DDE7D8" stroke="#294B3B" stroke-width="2"/><rect x="77" y="80" width="33" height="48" rx="0" fill="#DDE7D8" stroke="#294B3B" stroke-width="2"/></g><text x="128" y="316" font-size="13" fill="#294B3B" text-anchor="middle" font-weight="400">Handle the person gently</text><path d="M312 173 l27 -20 h43 l27 20 -19 38 -12 -7 v77 h-43 v-77 l-12 7 Z" fill="#DDE7D8" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M321 289 l-5 14 M351 291 l-5 14 M383 289 l-5 14" fill="none" stroke="#638485" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="360" y="326" font-size="13" fill="#294B3B" text-anchor="middle" font-weight="400">Replace wet clothing</text><circle cx="591" cy="174" r="18" fill="#F4EEE0" stroke="#294B3B" stroke-width="2"/><path d="M561 205 Q591 193 621 205 L629 289 L553 289 Z" fill="#DDE7D8" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M562 211 L621 272 M617 209 L569 260" fill="none" stroke="#5B6F5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="592" y="326" font-size="12" fill="#294B3B" text-anchor="middle" font-weight="400">Keep the body’s centre warm</text><path d="M24 356 H696" fill="none" stroke="#DDE7D8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="381" font-size="13" fill="#5B6F5D" text-anchor="start" font-weight="400">Confusion or severe cold exposure needs urgent help. No drinks if unconscious.</text></g></svg>