<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Track time and temperature during an outage.</title><desc id="desc">A closed refrigerator beside a four-hour clock, and a thermometer beside the instruction to use the FDA discard table.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#294B3B"/></marker></defs><rect width="720" height="400" rx="16" fill="#F8FAF5"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="39" font-size="24" fill="#294B3B" text-anchor="start" font-weight="600">Track time and temperature during an outage.</text><text x="24" y="65" font-size="12" fill="#5B6F5D" text-anchor="start" font-weight="600">PREPVAULT · VISUAL FIELD NOTES</text><rect x="24" y="88" width="317" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><rect x="362" y="88" width="334" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><rect x="65" y="119" width="109" height="187" rx="10" fill="white" stroke="#294B3B" stroke-width="3"/><path d="M65 184 h109 M153 143 v22 M153 205 v34" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="243" cy="166" r="41" fill="white" stroke="#294B3B" stroke-width="3"/><path d="M243 137 v29 l23 13" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="244" y="234" font-size="22" fill="#294B3B" text-anchor="middle" font-weight="600">~4 hours</text><text x="244" y="259" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="400">unopened fridge</text><text x="244" y="280" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="400">during an outage</text><text x="120" y="325" font-size="13" fill="#294B3B" text-anchor="middle" font-weight="600">KEEP CLOSED</text><rect x="395" y="125" width="35" height="113" rx="17" fill="white" stroke="#294B3B" stroke-width="3"/><circle cx="412" cy="230" r="22" fill="#DDE7D8" stroke="#294B3B" stroke-width="3"/><path d="M412 219 v-70" fill="none" stroke="#5B6F5D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><text x="461" y="145" font-size="18" fill="#294B3B" text-anchor="start" font-weight="400">Check the thermometer</text><text x="461" y="172" font-size="18" fill="#294B3B" text-anchor="start" font-weight="400">AND elapsed time.</text><text x="394" y="284" font-size="16" fill="#294B3B" text-anchor="start" font-weight="400">Use the FDA discard table.</text><text x="394" y="309" font-size="16" fill="#294B3B" text-anchor="start" font-weight="400">Do not taste food to test it.</text><path d="M24 356 H696" fill="none" stroke="#DDE7D8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="381" font-size="13" fill="#5B6F5D" text-anchor="start" font-weight="400">Original schematic • Read the full instructions before practising.</text></g></svg>