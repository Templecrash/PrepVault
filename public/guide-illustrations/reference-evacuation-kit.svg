<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Keep the grab list and departure route together.</title><desc id="desc">An accessible go-bag, identity document and medication container sit beside a marked evacuation route.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#294B3B"/></marker></defs><rect width="720" height="400" rx="16" fill="#F8FAF5"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="39" font-size="24" fill="#294B3B" text-anchor="start" font-weight="600">Keep the grab list and departure route together.</text><text x="24" y="65" font-size="12" fill="#5B6F5D" text-anchor="start" font-weight="600">PREPVAULT · VISUAL FIELD NOTES</text><rect x="24" y="88" width="307" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><rect x="352" y="88" width="344" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><path d="M90 161 q0 -28 32 -28 h48 q32 0 32 28 v133 H90 Z" fill="#DDE7D8" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M119 133 v-21 h55 v21" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="110" y="201" width="72" height="60" rx="8" fill="white" stroke="#294B3B" stroke-width="2"/><text x="145" y="237" font-size="15" fill="#294B3B" text-anchor="middle" font-weight="600">GO BAG</text><rect x="231" y="120" width="55" height="73" rx="4" fill="white" stroke="#294B3B" stroke-width="2"/><text x="259" y="149" font-size="18" fill="#294B3B" text-anchor="middle" font-weight="400">ID</text><rect x="239" y="214" width="40" height="63" rx="5" fill="#DDE7D8" stroke="#294B3B" stroke-width="2"/><rect x="234" y="205" width="50" height="11" rx="2" fill="white" stroke="#294B3B" stroke-width="2"/><text x="259" y="247" font-size="16" fill="#294B3B" text-anchor="middle" font-weight="400">Rx</text><text x="176" y="317" font-size="13" fill="#294B3B" text-anchor="middle" font-weight="400">Kit · medicines · ID · phone · pets</text><path d="M389 303 Q462 264 462 181 T611 131" fill="none" stroke="#DDE7D8" stroke-width="27" stroke-linecap="round" stroke-linejoin="round" /><path d="M389 303 Q462 264 462 181 T611 131" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/><path d="M550 135 L607 130" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="514" y="240" width="148" height="58" rx="7" fill="white" stroke="#294B3B" stroke-width="2"/><text x="588" y="263" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="400">Official evacuation</text><text x="588" y="284" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="400">route / destination</text><text x="525" y="321" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="400">Follow current instructions</text><path d="M24 356 H696" fill="none" stroke="#DDE7D8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="381" font-size="13" fill="#5B6F5D" text-anchor="start" font-weight="400">Never cross floodwater. The road shown is schematic, not a travel route.</text></g></svg>