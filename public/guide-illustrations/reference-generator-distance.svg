<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Keep the generator outside and away from openings.</title><desc id="desc">Generator outdoors to the right of a house, separated by a labelled minimum six-metre distance. Exhaust points away from the house.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#294B3B"/></marker></defs><rect width="720" height="400" rx="16" fill="#F8FAF5"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="39" font-size="24" fill="#294B3B" text-anchor="start" font-weight="600">Keep the generator outside and away from openings.</text><text x="24" y="65" font-size="12" fill="#5B6F5D" text-anchor="start" font-weight="600">PREPVAULT · VISUAL FIELD NOTES</text><path d="M45 154 L154.0 104 L263 154" fill="#DDE7D8" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="60" y="154" width="188" height="137" rx="0" fill="white" stroke="#294B3B" stroke-width="3"/><rect x="80" y="176" width="35" height="33" rx="0" fill="#DDE7D8" stroke="#294B3B" stroke-width="2"/><rect x="195" y="184" width="33" height="107" rx="0" fill="#DDE7D8" stroke="#294B3B" stroke-width="2"/><rect x="83" y="216" width="48" height="30" rx="5" fill="white" stroke="#294B3B" stroke-width="2"/><text x="107" y="236" font-size="16" fill="#294B3B" text-anchor="middle" font-weight="600">CO</text><text x="150" y="318" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="400">Building with working CO alarms</text><path d="M25 296 H698" fill="none" stroke="#5B6F5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="509" y="211" width="121" height="78" rx="10" fill="#DDE7D8" stroke="#294B3B" stroke-width="3"/><path d="M527 211 v-15 h85 v15" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="540" cy="289" r="10" fill="white" stroke="#294B3B" stroke-width="3"/><circle cx="604" cy="289" r="10" fill="white" stroke="#294B3B" stroke-width="3"/><rect x="524" y="230" width="38" height="31" rx="3" fill="white" stroke="#294B3B" stroke-width="2"/><path d="M580 233 h27 M580 245 h27 M580 257 h27" fill="none" stroke="#5B6F5D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M633 235 L689 235" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="662" y="208" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="400">Exhaust</text><text x="662" y="265" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="400">away</text><path d="M267 171 H506" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="386" y="145" font-size="19" fill="#294B3B" text-anchor="middle" font-weight="600">At least 6 m / 20 ft</text><text x="570" y="318" font-size="15" fill="#294B3B" text-anchor="middle" font-weight="600">OUTDOORS ONLY</text><path d="M24 356 H696" fill="none" stroke="#DDE7D8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="381" font-size="13" fill="#5B6F5D" text-anchor="start" font-weight="400">CO alarm sounding? Leave for fresh air and call emergency services from outside.</text></g></svg>