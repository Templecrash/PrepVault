<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Match the vehicle and serial range before a task.</title><desc id="desc">A generic vehicle identification plate points to the exact manual; notes require the correct parts drawing and service specifications.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#294B3B"/></marker></defs><rect width="720" height="400" rx="16" fill="#F8FAF5"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="39" font-size="24" fill="#294B3B" text-anchor="start" font-weight="600">Match the vehicle and serial range before a task.</text><text x="24" y="65" font-size="12" fill="#5B6F5D" text-anchor="start" font-weight="600">PREPVAULT · VISUAL FIELD NOTES</text><rect x="24" y="88" width="672" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><path d="M51 229 L76 183 H175 L205 229 V278 H51 Z" fill="#DDE7D8" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M85 193 h78 l18 36 H66 Z" fill="white" stroke="#294B3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="85" cy="281" r="20" fill="white" stroke="#294B3B" stroke-width="3"/><circle cx="176" cy="281" r="20" fill="white" stroke="#294B3B" stroke-width="3"/><rect x="91" y="242" width="76" height="22" rx="2" fill="white" stroke="#294B3B" stroke-width="2"/><text x="129" y="257" font-size="11" fill="#294B3B" text-anchor="middle" font-weight="400">ID PLATE</text><path d="M220 230 L304 230" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="323" y="133" width="113" height="143" rx="4" fill="white" stroke="#294B3B" stroke-width="3"/><text x="379" y="162" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="600">MATCH MODEL</text><path d="M343 181 h73 M343 198 h61 M343 215 h73 M343 232 h45" fill="none" stroke="#5B6F5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="480" y="142" font-size="16" fill="#294B3B" text-anchor="start" font-weight="400">Model / year / serial range</text><text x="480" y="178" font-size="16" fill="#294B3B" text-anchor="start" font-weight="400">Use the correct parts diagram</text><text x="480" y="214" font-size="16" fill="#294B3B" text-anchor="start" font-weight="400">Confirm service specifications</text><text x="481" y="280" font-size="14" fill="#294B3B" text-anchor="start" font-weight="400">Do not infer torque, fluids</text><text x="481" y="302" font-size="14" fill="#294B3B" text-anchor="start" font-weight="400">or procedures from a sketch.</text><path d="M24 356 H696" fill="none" stroke="#DDE7D8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="381" font-size="13" fill="#5B6F5D" text-anchor="start" font-weight="400">The manufacturer’s model-specific diagrams and specifications control the repair.</text></g></svg>