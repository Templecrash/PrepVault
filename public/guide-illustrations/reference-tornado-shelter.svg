<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Identify your shelter before a tornado warning.</title><desc id="desc">House cutaway highlights a basement and a small windowless interior room on the lowest above-ground floor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#294B3B"/></marker></defs><rect width="720" height="400" rx="16" fill="#F8FAF5"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="39" font-size="24" fill="#294B3B" text-anchor="start" font-weight="600">Identify your shelter before a tornado warning.</text><text x="24" y="65" font-size="12" fill="#5B6F5D" text-anchor="start" font-weight="600">PREPVAULT · VISUAL FIELD NOTES</text><path d="M55 156 L251 90 L447 156" fill="#DDE7D8" stroke="#294B3B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="78" y="157" width="347" height="139" rx="0" fill="white" stroke="#294B3B" stroke-width="4"/><path d="M194 157 V296 M319 157 V296 M78 225 H425" fill="none" stroke="#5B6F5D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="210" y="242" width="91" height="40" rx="2" fill="#DDE7D8" stroke="#294B3B" stroke-width="3"/><rect x="109" y="172" width="42" height="31" rx="0" fill="#DDE7D8" stroke="#294B3B" stroke-width="2"/><rect x="352" y="172" width="42" height="31" rx="0" fill="#DDE7D8" stroke="#294B3B" stroke-width="2"/><rect x="78" y="297" width="347" height="42" rx="0" fill="#DDE7D8" stroke="#294B3B" stroke-width="3"/><text x="251" y="323" font-size="15" fill="#294B3B" text-anchor="middle" font-weight="400">Basement, if available</text><text x="255" y="267" font-size="12" fill="#294B3B" text-anchor="middle" font-weight="600">Interior room</text><text x="476" y="150" font-size="17" fill="#294B3B" text-anchor="start" font-weight="400">Small interior room</text><text x="476" y="175" font-size="17" fill="#294B3B" text-anchor="start" font-weight="400">on the lowest floor</text><text x="476" y="200" font-size="17" fill="#294B3B" text-anchor="start" font-weight="400">of a sturdy building.</text><path d="M477 226 L311 258" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="476" y="286" font-size="16" fill="#294B3B" text-anchor="start" font-weight="400">Stay away from windows.</text><text x="476" y="311" font-size="16" fill="#294B3B" text-anchor="start" font-weight="400">Protect your head.</text><path d="M24 356 H696" fill="none" stroke="#DDE7D8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="381" font-size="13" fill="#5B6F5D" text-anchor="start" font-weight="400">A vehicle, mobile home, shed or tent is not a sturdy tornado shelter.</text></g></svg>