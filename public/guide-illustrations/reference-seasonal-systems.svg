<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Make a seasonal checklist for each household system.</title><desc id="desc">House section with identified water-system points, heating equipment and a separate backup-power preparation note.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#294B3B"/></marker></defs><rect width="720" height="400" rx="16" fill="#F8FAF5"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="39" font-size="24" fill="#294B3B" text-anchor="start" font-weight="600">Make a seasonal checklist for each household system.</text><text x="24" y="65" font-size="12" fill="#5B6F5D" text-anchor="start" font-weight="600">PREPVAULT · VISUAL FIELD NOTES</text><path d="M210 160 L345.0 110 L480 160" fill="#DDE7D8" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="225" y="160" width="240" height="153" rx="0" fill="white" stroke="#294B3B" stroke-width="3"/><rect x="245" y="182" width="35" height="33" rx="0" fill="#DDE7D8" stroke="#294B3B" stroke-width="2"/><rect x="412" y="190" width="33" height="123" rx="0" fill="#DDE7D8" stroke="#294B3B" stroke-width="2"/><path d="M242 256 h204" fill="none" stroke="#5B6F5D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="271" cy="256" r="12" fill="#DDE7D8" stroke="#294B3B" stroke-width="2"/><circle cx="413" cy="256" r="12" fill="#DDE7D8" stroke="#294B3B" stroke-width="2"/><path d="M271 247 v18 M262 256 h18 M413 247 v18 M404 256 h18" fill="none" stroke="#5B6F5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="137" font-size="15" fill="#294B3B" text-anchor="start" font-weight="400">Water systems</text><text x="24" y="160" font-size="15" fill="#294B3B" text-anchor="start" font-weight="400">Identify shutoffs and</text><text x="24" y="183" font-size="15" fill="#294B3B" text-anchor="start" font-weight="400">model-specific procedures.</text><path d="M187 175 L253 249" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="497" y="136" font-size="15" fill="#294B3B" text-anchor="start" font-weight="400">Heating equipment</text><text x="497" y="159" font-size="15" fill="#294B3B" text-anchor="start" font-weight="400">Book the appropriate</text><text x="497" y="182" font-size="15" fill="#294B3B" text-anchor="start" font-weight="400">service before cold weather.</text><path d="M495 204 L454 250" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="39" y="288" font-size="15" fill="#294B3B" text-anchor="start" font-weight="400">Power backup</text><text x="39" y="311" font-size="15" fill="#294B3B" text-anchor="start" font-weight="400">Check the generator’s</text><text x="39" y="334" font-size="15" fill="#294B3B" text-anchor="start" font-weight="400">outdoor operating location.</text><path d="M196 293 L221 307" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="503" y="294" font-size="15" fill="#294B3B" text-anchor="start" font-weight="400">Keep a dated checklist.</text><path d="M24 356 H696" fill="none" stroke="#DDE7D8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="381" font-size="13" fill="#5B6F5D" text-anchor="start" font-weight="400">Confirm each system and record the required service before starting work.</text></g></svg>