<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Set up clean water, soap and a catch basin.</title><desc id="desc">A water jug with a spigot sits on a stable surface; hands are washed with soap over a separate catch basin.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#294B3B"/></marker></defs><rect width="720" height="400" rx="16" fill="#F8FAF5"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="39" font-size="24" fill="#294B3B" text-anchor="start" font-weight="600">Set up clean water, soap and a catch basin.</text><text x="24" y="65" font-size="12" fill="#5B6F5D" text-anchor="start" font-weight="600">PREPVAULT · VISUAL FIELD NOTES</text><rect x="208" y="146" width="191" height="116" rx="4" fill="white" stroke="#294B3B" stroke-width="3"/><rect x="250" y="104" width="95" height="73" rx="9" fill="#DDE7D8" stroke="#294B3B" stroke-width="3"/><path d="M275 103 v-13 h43 v13" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M345 153 h25 v18" fill="none" stroke="#294B3B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M370 180 v55" fill="none" stroke="#638485" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><path d="M334 234 q16 -17 32 -4 l14 -7 q12 -2 18 10 l-24 23 h-40 Z" fill="#F4EEE0" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M333 270 h86 l-10 50 h-66 Z" fill="#DDE7D8" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="236" y="220" width="28" height="42" rx="3" fill="#DDE7D8" stroke="#294B3B" stroke-width="2"/><path d="M250 220 v-10 h17" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="31" y="130" font-size="17" fill="#294B3B" text-anchor="start" font-weight="600">Safe water</text><path d="M134 135 L245 136" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="40" y="233" font-size="17" fill="#294B3B" text-anchor="start" font-weight="400">Soap</text><text x="40" y="258" font-size="17" fill="#294B3B" text-anchor="start" font-weight="400">20 seconds</text><path d="M149 238 L228 238" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="477" y="144" font-size="17" fill="#294B3B" text-anchor="start" font-weight="400">Keep drinking-water</text><text x="477" y="169" font-size="17" fill="#294B3B" text-anchor="start" font-weight="400">containers separate.</text><text x="477" y="277" font-size="16" fill="#294B3B" text-anchor="start" font-weight="400">Catch used water;</text><text x="477" y="302" font-size="16" fill="#294B3B" text-anchor="start" font-weight="400">follow local disposal advice.</text><path d="M465 289 L426 294" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M24 356 H696" fill="none" stroke="#DDE7D8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="381" font-size="13" fill="#5B6F5D" text-anchor="start" font-weight="400">Wash for 20 seconds. Sanitizer is less effective on visibly dirty hands.</text></g></svg>