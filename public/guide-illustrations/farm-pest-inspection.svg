<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title description"><title id="title">Identify before you intervene</title><desc id="description">A magnified leaf shows an organism and damage, followed by a record and targeted response.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#314c3d"/></marker></defs><rect width="720" height="420" rx="14" fill="#f8faf5"/><text x="28" y="36" text-anchor="start" fill="#314c3d" font-size="23" font-family="Arial, Helvetica, sans-serif">Identify before you intervene</text><line x1="28" y1="56" x2="692" y2="56" stroke="#d9e2d1" stroke-width="1" stroke-linecap="round" /><g transform="translate(188 292) rotate(35) scale(3.3)"><path d="M0 0 Q-28 -4 -24 -29 Q0 -29 0 0" fill="#b7cbb0" stroke="#314c3d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="0" y1="0" x2="-17" y2="-21" stroke="#314c3d" stroke-width="1.5" stroke-linecap="round" /></g><circle cx="232" cy="211" r="67" fill="#f8faf5" stroke="#314c3d" stroke-width="2"/><line x1="279" y1="261" x2="331" y2="316" stroke="#314c3d" stroke-width="13" stroke-linecap="round" /><circle cx="232" cy="210" r="17" fill="#b7cbb0" stroke="#314c3d" stroke-width="2"/><line x1="216" y1="201" x2="198" y2="190" stroke="#314c3d" stroke-width="2" stroke-linecap="round" /><line x1="215" y1="211" x2="194" y2="213" stroke="#314c3d" stroke-width="2" stroke-linecap="round" /><line x1="216" y1="222" x2="199" y2="236" stroke="#314c3d" stroke-width="2" stroke-linecap="round" /><line x1="248" y1="201" x2="266" y2="190" stroke="#314c3d" stroke-width="2" stroke-linecap="round" /><line x1="249" y1="211" x2="270" y2="213" stroke="#314c3d" stroke-width="2" stroke-linecap="round" /><line x1="248" y1="222" x2="265" y2="236" stroke="#314c3d" stroke-width="2" stroke-linecap="round" /><rect x="417" y="127" width="254" height="220" rx="8" fill="white" stroke="#314c3d" stroke-width="2"/><text x="440" y="163" text-anchor="start" fill="#314c3d" font-size="20" font-family="Arial, Helvetica, sans-serif">Observe + record</text><text x="440" y="206" text-anchor="start" fill="#566958" font-size="17" font-family="Arial, Helvetica, sans-serif">Identify damage and</text><text x="440" y="228" text-anchor="start" fill="#566958" font-size="17" font-family="Arial, Helvetica, sans-serif">organism</text><line x1="440" y1="248" x2="646" y2="248" stroke="#cdd8c7" stroke-width="1" stroke-linecap="round" /><text x="440" y="280" text-anchor="start" fill="#566958" font-size="17" font-family="Arial, Helvetica, sans-serif">Choose a justified</text><text x="440" y="302" text-anchor="start" fill="#566958" font-size="17" font-family="Arial, Helvetica, sans-serif">response</text><text x="28" y="400" text-anchor="start" fill="#566958" font-size="13" font-family="Arial, Helvetica, sans-serif">Planning schematic · not to scale</text></svg>