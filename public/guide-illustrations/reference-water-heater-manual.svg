<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Match the water heater to its own instructions.</title><desc id="desc">An illustrative water heater rating plate points to the matching manufacturer manual.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#294B3B"/></marker></defs><rect width="720" height="400" rx="16" fill="#F8FAF5"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="39" font-size="24" fill="#294B3B" text-anchor="start" font-weight="600">Match the water heater to its own instructions.</text><text x="24" y="65" font-size="12" fill="#5B6F5D" text-anchor="start" font-weight="600">PREPVAULT · VISUAL FIELD NOTES</text><rect x="24" y="88" width="672" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><rect x="71" y="119" width="141" height="190" rx="36" fill="white" stroke="#294B3B" stroke-width="3"/><path d="M98 120 v-22 M183 120 v-22" fill="none" stroke="#5B6F5D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="106" y="173" width="72" height="67" rx="3" fill="#DDE7D8" stroke="#294B3B" stroke-width="2"/><text x="142" y="196" font-size="12" fill="#294B3B" text-anchor="middle" font-weight="400">MODEL</text><text x="142" y="216" font-size="12" fill="#294B3B" text-anchor="middle" font-weight="400">SERIAL</text><path d="M221 207 L330 207" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="355" y="121" width="113" height="143" rx="4" fill="white" stroke="#294B3B" stroke-width="3"/><text x="411" y="150" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="600">EXACT MODEL</text><path d="M375 169 h73 M375 186 h61 M375 203 h73 M375 220 h45" fill="none" stroke="#5B6F5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M374 243 l14 12 23 -29" fill="none" stroke="#5B6F5D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="505" y="148" font-size="17" fill="#294B3B" text-anchor="start" font-weight="400">1. Read the rating plate</text><text x="505" y="185" font-size="17" fill="#294B3B" text-anchor="start" font-weight="400">2. Match model + serial</text><text x="505" y="222" font-size="17" fill="#294B3B" text-anchor="start" font-weight="400">3. Open the maker’s guide</text><text x="506" y="282" font-size="14" fill="#294B3B" text-anchor="start" font-weight="400">Reset, isolation and draining</text><text x="506" y="304" font-size="14" fill="#294B3B" text-anchor="start" font-weight="400">steps depend on the model.</text><path d="M24 356 H696" fill="none" stroke="#DDE7D8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="381" font-size="13" fill="#5B6F5D" text-anchor="start" font-weight="400">A filename reference is not an attached manual. Confirm the actual document first.</text></g></svg>