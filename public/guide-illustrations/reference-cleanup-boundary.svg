<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Check whether it is safe to enter before cleaning.</title><desc id="desc">Damaged building behind a barrier beside an inspection checklist and a protective boot.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#294B3B"/></marker></defs><rect width="720" height="400" rx="16" fill="#F8FAF5"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="39" font-size="24" fill="#294B3B" text-anchor="start" font-weight="600">Check whether it is safe to enter before cleaning.</text><text x="24" y="65" font-size="12" fill="#5B6F5D" text-anchor="start" font-weight="600">PREPVAULT · VISUAL FIELD NOTES</text><rect x="24" y="88" width="330" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><rect x="375" y="88" width="321" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><path d="M67 180 L184 118 L308 181" fill="#DDE7D8" stroke="#294B3B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="87" y="182" width="201" height="115" rx="0" fill="white" stroke="#294B3B" stroke-width="3"/><path d="M182 184 l-12 23 22 21 -16 33" fill="none" stroke="#A27C43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M54 272 H321" fill="none" stroke="#A27C43" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><path d="M72 250 v62 M303 250 v62" fill="none" stroke="#5B6F5D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="189" y="324" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="600">STAY OUT UNTIL CLEARED</text><rect x="403" y="130" width="113" height="143" rx="4" fill="white" stroke="#294B3B" stroke-width="3"/><text x="459" y="159" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="60