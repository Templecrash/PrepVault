<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Use one out-of-area contact to reconnect.</title><desc id="desc">Two household members send short status texts through one out-of-area contact; the message includes safety, location and a next check-in.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#294B3B"/></marker></defs><rect width="720" height="400" rx="16" fill="#F8FAF5"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="39" font-size="24" fill="#294B3B" text-anchor="start" font-weight="600">Use one out-of-area contact to reconnect.</text><text x="24" y="65" font-size="12" fill="#5B6F5D" text-anchor="start" font-weight="600">PREPVAULT · VISUAL FIELD NOTES</text><rect x="320" y="101" width="82" height="126" rx="10" fill="white" stroke="#294B3B" stroke-width="3"/><path d="M344 112 h34" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="361" cy="212" r="4" fill="none" stroke="#294B3B" stroke-width="2"/><text x="361" y="144" font-size="13" fill="#294B3B" text-anchor="middle" font-weight="400">OUT-OF-</text><text x="361" y="163" font-size="13" fill="#294B3B" text-anchor="middle" font-weight="400">AREA</text><text x="361" y="182" font-size="13" fill="#294B3B" text-anchor="middle" font-weight="400">CONTACT</text><rect x="63" y="201" width="82" height="126" rx="10" fill="white" stroke="#294B3B" stroke-width="3"/><path d="M87 212 h34" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="104" cy="312" r="4" fill="none" stroke="#294B3B" stroke-width="2"/><text x="104" y="244" font-size="13" fill="#294B3B" text-anchor="middle" font-weight="400">HOUSEHOLD</text><text x="104" y="263" font-size="13" fill="#294B3B" text-anchor="middle" font-weight="400">MEMBER A</text><rect x="576" y="201" width="82" height="126" rx="10" fill="white" stroke="#294B3B" stroke-width="3"/><path d="M600 212 h34" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="617" cy="312" r="4" fill="none" stroke="#294B3B" stroke-width="2"/><text x="617" y="244" font-size="13" fill="#294B3B" text-anchor="middle" font-weight="400">HOUSEHOLD</text><text x="617" y="263" font-size="13" fill="#294B3B" text-anchor="middle" font-weight="400">MEMBER B</text><path d="M149 224 L309 159" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M407 159 L566 224" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="223" y="166" font-size="15" fill="#294B3B" text-anchor="middle" font-weight="400">Check in</text><text x="493" y="166" font-size="15" fill="#294B3B" text-anchor="middle" font-weight="400">Relay updates</text><rect x="241" y="253" width="238" height="76" rx="8" fill="#DDE7D8" stroke="#294B3B" stroke-width="2"/><text x="360" y="280" font-size="16" fill="#294B3B" text-anchor="middle" font-weight="400">Safe • At [place]</text><text x="360" y="305" font-size="16" fill="#294B3B" text-anchor="middle" font-weight="400">Next check-in [time]</text><path d="M145 309 H227 M493 309 H575" fill="none" stroke="#5B6F5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M24 356 H696" fill="none" stroke="#DDE7D8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="381" font-size="13" fill="#5B6F5D" text-anchor="start" font-weight="400">Texts may get through when calls do not. Keep a separate meeting-place plan.</text></g></svg>