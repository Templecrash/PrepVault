<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Build small. Leave it completely cold.</title><desc id="desc">Three stages: loosely crossed wood, water poured over coals, and ashes stirred until cold.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#294B3B"/></marker></defs><rect width="720" height="400" rx="16" fill="#F8FAF5"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="39" font-size="24" fill="#294B3B" text-anchor="start" font-weight="600">Build small. Leave it completely cold.</text><text x="24" y="65" font-size="12" fill="#5B6F5D" text-anchor="start" font-weight="600">PREPVAULT · VISUAL FIELD NOTES</text><rect x="24" y="88" width="208" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><circle cx="48" cy="112" r="13" fill="#294B3B" stroke="#294B3B" stroke-width="2"/><text x="48" y="117" font-size="14" fill="white" text-anchor="middle" font-weight="600">1</text><text x="70" y="117" font-size="16" fill="#294B3B" text-anchor="start" font-weight="600">Leave air gaps</text><rect x="256" y="88" width="208" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><circle cx="280" cy="112" r="13" fill="#294B3B" stroke="#294B3B" stroke-width="2"/><text x="280" y="117" font-size="14" fill="white" text-anchor="middle" font-weight="600">2</text><text x="302" y="117" font-size="16" fill="#294B3B" text-anchor="start" font-weight="600">Douse the coals</text><rect x="488" y="88" width="208" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><circle cx="512" cy="112" r="13" fill="#294B3B" stroke="#294B3B" stroke-width="2"/><text x="512" y="117" font-size="14" fill="white" text-anchor="middle" font-weight="600">3</text><text x="534" y="117" font-size="16" fill="#294B3B" text-anchor="start" font-weight="600">Stir; repeat until cold</text><g transform="translate(52 164) scale(1)"><path d="M4 64 L136 30 M3 30 L135 64" fill="none" stroke="#A27C43" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /><path d="M35 11 L104 85 M104 11 L35 85" fill="none" stroke="#5B6F5D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><path d="M49 33 L88 39 M60 49 L96 57" fill="none" stroke="#A27C43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="128" y="288" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="400">Small, attended fire</text><text x="128" y="309" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="400">in a permitted fire area</text><g transform="translate(280 153) scale(1)"><rect x="14" y="0" width="70" height="65" rx="5" fill="#DDE7D8" stroke="#294B3B" stroke-width="2"/><path d="M84 32 q28 0 36 30" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M119 68 l-10 20 M129 74 l-7 20 M137 81 l-3 15" fill="none" stroke="#638485" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M11 128 h133" fill="none" stroke="#A27C43" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><path d="M29 114 l70 12 M50 126 l63 -13" fill="none" stroke="#5B6F5D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="360" y="309" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="400">Pour water over embers</text><g transform="translate(510 140) scale(1)"><path d="M21 127 h138" fill="none" stroke="#A27C43" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><path d="M53 125 L134 26" fill="none" stroke="#5B6F5D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M48 105 q-20 -35 21 -46" fill="none" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="120" cy="72" r="13" fill="#DDE7D8" stroke="#294B3B" stroke-width="2"/><path d="M114 72 l5 5 9 -11" fill="none" stroke="#294B3B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="592" y="289" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="400">Mix ashes and water</text><text x="592" y="310" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="400">No remaining heat</text><path d="M24 356 H696" fill="none" stroke="#DDE7D8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="381" font-size="13" fill="#5B6F5D" text-anchor="start" font-weight="400">Original schematic • Read the full instructions before practising.</text></g></svg>