<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Clean, cover and check minor wounds.</title><desc id="desc">A minor forearm cut is washed with soap and clean water, covered with a clean bandage, then checked for infection signs.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#294B3B"/></marker></defs><rect width="720" height="400" rx="16" fill="#F8FAF5"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="39" font-size="24" fill="#294B3B" text-anchor="start" font-weight="600">Clean, cover and check minor wounds.</text><text x="24" y="65" font-size="12" fill="#5B6F5D" text-anchor="start" font-weight="600">PREPVAULT · VISUAL FIELD NOTES</text><rect x="24" y="88" width="208" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><circle cx="48" cy="112" r="13" fill="#294B3B" stroke="#294B3B" stroke-width="2"/><text x="48" y="117" font-size="14" fill="white" text-anchor="middle" font-weight="600">1</text><text x="70" y="117" font-size="16" fill="#294B3B" text-anchor="start" font-weight="600">Wash a minor wound</text><rect x="256" y="88" width="208" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><circle cx="280" cy="112" r="13" fill="#294B3B" stroke="#294B3B" stroke-width="2"/><text x="280" y="117" font-size="14" fill="white" text-anchor="middle" font-weight="600">2</text><text x="302" y="117" font-size="16" fill="#294B3B" text-anchor="start" font-weight="600">Protect it</text><rect x="488" y="88" width="208" height="248" rx="10" fill="white" stroke="#DDE7D8" stroke-width="2"/><circle cx="512" cy="112" r="13" fill="#294B3B" stroke="#294B3B" stroke-width="2"/><text x="512" y="117" font-size="14" fill="white" text-anchor="middle" font-weight="600">3</text><text x="534" y="117" font-size="16" fill="#294B3B" text-anchor="start" font-weight="600">Watch for changes</text><g transform="translate(43 175) scale(1)"><path d="M10 87 h155 v42 H10 Z" fill="#F4EEE0" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M72 94 l13 13" fill="none" stroke="#A27C43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M69 0 h30 v16 H69 Z" fill="#DDE7D8" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M84 23 v62" fill="none" stroke="#638485" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><rect x="119" y="25" width="38" height="42" rx="4" fill="#DDE7D8" stroke="#294B3B" stroke-width="2"/><text x="138" y="53" font-size="11" fill="#294B3B" text-anchor="middle" font-weight="400">Soap</text></g><g transform="translate(276 175) scale(1)"><path d="M10 87 h155 v42 H10 Z" fill="#F4EEE0" stroke="#294B3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="51" y="78" width="78" height="43" rx="10" fill="#DDE7D8" stroke="#294B3B" stroke-width="3"/><rect x="74" y="84" width="31" height="30" rx="2" fill="white" stroke="#294B3B" stroke-width="2"/><path d="M59 92 v17 M121 92 v17" fill="none" stroke="#5B6F5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="537" y="149" width="113" height="143" rx="4" fill="white" stroke="#294B3B" stroke-width="3"/><text x="593" y="178" font-size="14" fill="#294B3B" text-anchor="middle" font-weight="600">CHECK DAILY</text><path d="M557 197 h73 M557 214 h61 M557 231 h73 M557 248 h45" fill="none" stroke="#5B6F5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="592" y="307" font-size="12" fill="#294B3B" text-anchor="middle" font-weight="400">Redness, swelling, drainage?</text><path d="M24 356 H696" fill="none" stroke="#DDE7D8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="381" font-size="13" fill="#5B6F5D" text-anchor="start" font-weight="400">Keep wounds out of floodwater. Severe bleeding needs immediate help.</text></g></svg>